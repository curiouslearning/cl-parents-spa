<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Video Player</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 1200px;
        width: 100%;
      }

      h1 {
        color: #333;
        text-align: center;
        margin-bottom: 30px;
        font-size: 2.5em;
        font-weight: 700;
      }

      .video-wrapper {
        position: relative;
        padding-bottom: 56.25%; /* 16:9 aspect ratio */
        height: 0;
        overflow: hidden;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        background: #000;
      }

      .video-wrapper iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }

      .instructions {
        margin-top: 30px;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 10px;
        border-left: 4px solid #667eea;
      }

      .instructions h2 {
        color: #333;
        margin-bottom: 15px;
        font-size: 1.3em;
      }

      .instructions ol {
        margin-left: 20px;
        color: #555;
        line-height: 1.8;
      }

      .instructions li {
        margin-bottom: 10px;
      }

      .instructions code {
        background: #e9ecef;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: "Courier New", monospace;
        color: #d63384;
      }

      .play-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        border-radius: 12px;
        cursor: pointer;
        z-index: 10;
        transition: background 0.3s ease;
      }

      .play-overlay.show {
        display: flex;
      }

      .play-overlay:hover {
        background: rgba(0, 0, 0, 0.8);
      }

      .play-button {
        width: 100px;
        height: 100px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        transition: transform 0.3s ease, background 0.3s ease;
      }

      .play-overlay:hover .play-button {
        transform: scale(1.1);
        background: rgba(255, 255, 255, 1);
      }

      .play-button::after {
        content: "";
        width: 0;
        height: 0;
        border-left: 35px solid #667eea;
        border-top: 25px solid transparent;
        border-bottom: 25px solid transparent;
        margin-left: 8px;
      }

      .play-overlay-text {
        position: absolute;
        bottom: 30px;
        color: white;
        font-size: 1.2em;
        font-weight: 500;
        text-align: center;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎬 YouTube Video Player</h1>

      <div class="video-wrapper">
        <!-- Replace the src URL below with your YouTube embed code -->
        <!-- Format: https://www.youtube.com/embed/VIDEO_ID?rel=0&modestbranding=1&iv_load_policy=3&enablejsapi=1 -->
        <!-- rel=0 prevents showing related videos at the end -->
        <!-- enablejsapi=1 enables the YouTube IFrame API -->
        <iframe
          id="youtube-player"
          src="https://www.youtube.com/embed/GHaclxuG_tQ?rel=0&modestbranding=1&iv_load_policy=3&enablejsapi=1&controls=1&showinfo=0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        >
        </iframe>
        <div class="play-overlay" id="play-overlay">
          <div class="play-button"></div>
          <div class="play-overlay-text">Click to replay video</div>
        </div>
      </div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
      let player;
      const overlay = document.getElementById("play-overlay");

      // This function will be called when the YouTube API is ready
      function onYouTubeIframeAPIReady() {
        player = new YT.Player("youtube-player", {
          events: {
            onStateChange: onPlayerStateChange,
          },
        });
      }

      // Handle player state changes
      function onPlayerStateChange(event) {
        // When video ends (state 0 = ended)
        if (event.data === YT.PlayerState.ENDED) {
          overlay.classList.add("show");
        }
        // When video is playing, hide the overlay
        else if (event.data === YT.PlayerState.PLAYING) {
          overlay.classList.remove("show");
        }
      }

      // Restart video when overlay is clicked
      overlay.addEventListener("click", function () {
        if (player) {
          player.seekTo(0); // Go to start
          player.playVideo(); // Start playing
          overlay.classList.remove("show");
        }
      });
    </script>
  </body>
</html>
