<!doctype html>
<html>
  <head>
    <title>Parent Welcome Page</title>

    <meta
      name="description"
      content="Welcome Parent Video from Curious Learning"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <div id="background">
      <img src="./assets/images/sky_background.png" class="bg sky" />
      <img src="./assets/images/hill.png" class="bg hill" />
      <img src="./assets/images/foreground_foliage.png" class="bg bushes" />
    </div>
    <h1 class="video-title" id="video-title"></h1>
    <!-- Orange Close Button - Always visible in top left -->
    <button id="orange-close-btn" class="orange-close-btn" aria-label="Close">
      <img src="./assets/images/cancel.png" alt="Close" class="cancel-icon" />
    </button>

    <div class="container">
      <div class="video-wrapper" id="video-wrapper">
        <div class="play-overlay" id="play-overlay">
          <div class="play-button"></div>
          <div class="play-overlay-text">Click to replay video</div>
        </div>
      </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="dist/bundle.js"></script>
  </body>
</html>
