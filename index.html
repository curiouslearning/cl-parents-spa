<!doctype html>
<html>
  <head>
    <title>Parent Welcome Page</title>

    <meta
      name="description"
      content="Assessment/Survey from Curious Learning"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <div id="background">
      <img src="./assets/images/sky_background.png" class="bg sky" />
      <img src="./assets/images/hill.png" class="bg hill" />
      <img src="./assets/images/foreground_foliage.png" class="bg bushes" />
    </div>

    <!-- <div class="video-header">
      <i data-lucide="video"></i>

    </div> -->

    <button id="orange-close-btn" class="orange-close-btn" aria-label="Close">

    </button>

    <div class="container">

          <div class="play-overlay-text">Click to replay video</div>
